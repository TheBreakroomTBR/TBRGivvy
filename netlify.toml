[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Exact path: the front end calls POST /api
[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# Public read-only data for view.html: GET /public and /public?g=recXXX
[[redirects]]
  from = "/public"
  to = "/.netlify/functions/public"
  status = 200
  force = true

# Customers land on the read-only view; the admin lives at /admin (still locked per device).
[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/"
  to = "/view.html"
  status = 200
  force = true
