[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Exact path: the front end calls POST /api
[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# Public read-only data for view.html: GET /public and /public?g=recXXX
[[redirects]]
  from = "/public"
  to = "/.netlify/functions/public"
  status = 200
  force = true
